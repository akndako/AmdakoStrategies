---
deployment:
  targets:
    - deployment_target: "amdakostrategies.com.ng"
      repository_root: "/"
      working_directory: "/"
      build_command: "/bin/bash deploy-frontend.sh"
      test_command: "test -d public_html/amdako && test -f public_html/amdako/index.html"
      restart_reload_command: "echo 'Frontend deployed successfully'"
      environment_variables:
        - NODE_ENV=production
hooks:
  post_deployment:
    - echo "✅ Frontend deployment verified"
    - echo "📍 Website: https://amdakostrategies.com.ng"
