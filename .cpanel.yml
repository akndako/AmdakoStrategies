---
deployment:
  targets:
    - deployment_target: "amdakostrategies.com.ng"
      repository_root: "/"
      working_directory: "/"
      build_command: "/bin/bash deploy-frontend.sh"
      test_command: "test -f frontend/dist/index.html"
      restart_reload_command: "echo 'Frontend deployed'"
hooks:
  build:
    - export PATH=$PATH:/usr/local/bin
    - cd frontend && npm install --production && npm run build && cd ..
  post_deployment:
    - echo "✅ Frontend deployed successfully"
